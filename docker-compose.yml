services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: servicehub
      POSTGRES_DB: servicehub
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicehub -d servicehub"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://servicehub:servicehub@db:5432/servicehub?schema=public
      TZ: Asia/Bangkok
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    # seed อัตโนมัติเฉพาะเมื่อฐานข้อมูลว่าง (รีสตาร์ทไม่ล้างข้อมูล) — ล้างและ seed ใหม่ด้วย: docker compose exec web npx prisma db seed
    command: sh -c "npx prisma migrate deploy && SEED_IF_EMPTY=1 npx prisma db seed && npm run dev"

volumes:
  pgdata:
  node_modules:
  next_cache:
